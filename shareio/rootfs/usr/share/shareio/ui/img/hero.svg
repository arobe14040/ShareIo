<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 200" role="img" aria-label="Files being shared">
  <defs>
    <radialGradient id="h-glow" cx=".5" cy=".55" r=".55">
      <stop offset="0" stop-color="#A5B4FC" stop-opacity=".55"/>
      <stop offset="1" stop-color="#A5B4FC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="h-brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>
    <linearGradient id="h-tray" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EEF2FF"/>
      <stop offset="1" stop-color="#E0E7FF"/>
    </linearGradient>
    <filter id="h-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#312E81" flood-opacity=".18"/>
    </filter>
  </defs>

  <ellipse cx="160" cy="112" rx="150" ry="88" fill="url(#h-glow)"/>

  <!-- sparkles -->
  <g fill="#C4B5FD">
    <path d="M58 46l2.5 6 6 2.5-6 2.5-2.5 6-2.5-6-6-2.5 6-2.5z"/>
    <path d="M268 132l2 4.6 4.6 2-4.6 2-2 4.6-2-4.6-4.6-2 4.6-2z" fill="#67E8F9"/>
    <circle cx="246" cy="44" r="3" fill="#67E8F9"/>
    <circle cx="74" cy="150" r="2.5"/>
  </g>

  <!-- file cards -->
  <g filter="url(#h-shadow)">
    <g transform="rotate(-14 112 98)">
      <rect x="86" y="62" width="52" height="66" rx="9" fill="#FFFFFF"/>
      <path d="M124 62h5a9 9 0 0 1 9 9v5h-9a5 5 0 0 1-5-5z" fill="#E0E7FF"/>
      <rect x="96" y="88" width="32" height="5" rx="2.5" fill="#C7D2FE"/>
      <rect x="96" y="99" width="24" height="5" rx="2.5" fill="#E0E7FF"/>
      <rect x="96" y="110" width="28" height="5" rx="2.5" fill="#E0E7FF"/>
    </g>
    <g transform="rotate(10 206 92)">
      <rect x="180" y="58" width="52" height="66" rx="9" fill="#FFFFFF"/>
      <rect x="190" y="70" width="32" height="26" rx="5" fill="#CFFAFE"/>
      <path d="M190 92l9-9 7 6 5-4 11 11v2a5 5 0 0 1-5 0z" fill="#67E8F9"/>
      <circle cx="214" cy="78" r="3.5" fill="#FFFFFF"/>
      <rect x="190" y="104" width="26" height="5" rx="2.5" fill="#E0E7FF"/>
    </g>
    <g>
      <rect x="132" y="44" width="56" height="72" rx="10" fill="url(#h-brand)"/>
      <path d="M150 88l10-10 10 10M160 79v22" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- tray -->
  <g filter="url(#h-shadow)">
    <path d="M86 128h148l-12 38a10 10 0 0 1-9.5 7H107.5a10 10 0 0 1-9.5-7z" fill="url(#h-tray)"/>
    <path d="M86 128h46l6 12h44l6-12h46" fill="none" stroke="#A5B4FC" stroke-width="3" stroke-linejoin="round"/>
  </g>

  <!-- paper plane with trail -->
  <path d="M232 36c-14 2-26 8-34 18" fill="none" stroke="#A5B4FC" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="2 7"/>
  <g transform="translate(234 16) scale(.62)">
    <path d="M14.6 31.2 48.4 17.4c1.5-.6 2.9.8 2.3 2.3L40.9 46.6c-.6 1.6-2.7 1.9-3.7.6l-5.6-7.1-6.3 5.2c-1 .8-2.5.1-2.5-1.2v-7.5l-8.2-3.3c-1.7-.7-1.7-3.1 0-3.8z" fill="url(#h-brand)"/>
    <path d="M22.8 36.6 49 18.6 31.6 40.1l-6.3 5.2c-1 .8-2.5.1-2.5-1.2z" fill="#7C3AED"/>
  </g>
