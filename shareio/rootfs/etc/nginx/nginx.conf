# ShareIo front proxy.
#
# The ShareIo server listens only on 127.0.0.1:9091. NGINX exposes it twice:
#
#   8099  Home Assistant ingress (sidebar panel). Only the Supervisor
#         (172.30.32.2) may connect. The logged-in Home Assistant user is
#         passed on for automatic login, and the web app is adapted to run
#         under the ingress path (/api/hassio_ingress/<token>).
#
#   9090  Direct access (optional published port). Identity headers sent by
#         clients are always removed, so nobody can impersonate a user.
#
# The web app does not support running under a path, so for ingress NGINX
# rewrites a few known strings in its HTML and JavaScript (sub_filter). If a
# future server version changes those strings, ingress may break while
# direct access keeps working.

worker_processes 1;
pid /run/nginx.pid;
error_log stderr warn;
user nginx;

events {
    worker_connections 512;
}

http {
    include /etc/nginx/mime.types;
    access_log off;
    server_tokens off;

    client_max_body_size 0;
    proxy_http_version 1.1;
    proxy_request_buffering off;
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;

    upstream shareio_server {
        server 127.0.0.1:9091;
    }

    # --- Direct access ------------------------------------------------------
    server {
        listen 9090 default_server;

        location / {
            proxy_pass http://shareio_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # Never trust identity headers from outside.
            proxy_set_header X-ShareIo-User "";
            proxy_set_header X-ShareIo-Email "";
            proxy_set_header Accept-Encoding "";

            # Hide the Home Assistant login button here; it only works via ingress.
            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;
            sub_filter '"proxyAuthEnabled" : true' '"proxyAuthEnabled" : false';
        }
    }

    # --- Home Assistant ingress ---------------------------------------------
    server {
        listen 8099;
        allow 172.30.32.2;
        deny all;
        # Keep rewritten redirects relative; otherwise NGINX would add its own
        # host and port 8099, which the browser cannot reach.
        absolute_redirect off;

        location / {
            proxy_pass http://shareio_server;
            proxy_set_header Host $http_host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Accept-Encoding "";
            # Log in as the Home Assistant user that opened the panel.
            proxy_set_header X-ShareIo-User $http_x_remote_user_name;
            proxy_set_header X-ShareIo-Email "";

            # Keep redirects and the auth cookie inside the ingress path.
            proxy_redirect ~^https?://[^/]+(/.*)?$ $http_x_ingress_path$1;
            proxy_redirect ~^(/.*)$ $http_x_ingress_path$1;
            proxy_cookie_path ~^(/.*)$ $http_x_ingress_path$1;
            # Home Assistant may be opened over plain http on the LAN.
            proxy_cookie_flags ~ nosecure;

            sub_filter_types application/javascript text/javascript;
            sub_filter_once off;

            # HTML: helper that maps between the ingress path and the app's
            # own root-based URLs, used by the rewrites below.
            sub_filter '<head>' "<head><script>(function(){var p='$http_x_ingress_path';var o=window.location.origin;function add(u){if(typeof u!=='string')return u;if(u.indexOf(o+p+'/')===0||u.indexOf(p+'/')===0)return u;if(u.indexOf(o+'/')===0)return o+p+u.slice(o.length);if(u.charAt(0)==='/')return p+u;return u;}function strip(h){return h.indexOf(o+p)===0?(o+(h.slice((o+p).length)||'/')):h;}window.__ingress={prefix:p,add:add,strip:strip};var hp=history.pushState,hr=history.replaceState;history.pushState=function(s,t,u){return hp.call(history,s,t,u==null?u:add(String(u)));};history.replaceState=function(s,t,u){return hr.call(history,s,t,u==null?u:add(String(u)));};})();</script>";
            # HTML: assets, API base URL, automatic login, no service worker.
            sub_filter '"/app/' '"$http_x_ingress_path/app/';
            sub_filter 'var storedAccount = ' 'sharryFlags.baseUrl = window.location.origin + window.__ingress.prefix; var storedAccount = ';
            sub_filter '"proxyOnly" : false' '"proxyOnly" : true';
            sub_filter '"hideLoginForm" : false' '"hideLoginForm" : true';
            sub_filter "if('serviceWorker' in navigator)" 'if(false)';

            # JavaScript: let the app see root-based URLs and navigate within
            # the ingress path.
            sub_filter '_VirtualDom_doc.location.href)' 'window.__ingress.strip(_VirtualDom_doc.location.href))';
            sub_filter '_Browser_window.location = url;' '_Browser_window.location = window.__ingress.add(url);';
            # Optional: treat app links as in-app navigation instead of reloads.
            sub_filter "model.fC.b.c + '/app'" "window.location.origin + '/app'";
        }
    }
}
