# ShareIo server settings.
#
# Only values that differ from the bundled server's defaults live here.
# Everything else comes from the reference.conf shipped with the server
# release, so new options and changed defaults apply automatically.
# The "sharry.restserver" key names are fixed by the upstream server.
# Full default config: https://eikek.github.io/sharry/doc/configure
#
# Several values are set at startup as -D properties by
# /etc/services.d/shareio/run (base-url, database, secret, theme, language,
# share limits, log level) and override what is written here.
sharry.restserver {

  # Set from the add-on options at startup.
  base-url = "http://homeassistant.local:9090"

  # Only reachable inside the add-on. NGINX serves it on 8099 (ingress)
  # and 9090 (direct). Must stay on localhost so the user header from
  # ingress cannot be faked.
  #### CANNOT OVERRIDE (enforced in cont-init.d/30-config.sh)
  bind {
    address = "127.0.0.1"
    port = 9091
  }

  logging {
    minimum-level = "Info"
    levels = {
      "sharry" = ${sharry.restserver.logging.minimum-level}
      "org.flywaydb" = ${sharry.restserver.logging.minimum-level}
      "binny" = ${sharry.restserver.logging.minimum-level}
      "org.http4s" = ${sharry.restserver.logging.minimum-level}
    }
  }

  webapp {
    # Branding shown in the browser tab, header and footer.
    app-name = "ShareIo"
    app-icon = "/app/shareio-ui/img/icon.svg"
    app-icon-dark = "/app/shareio-ui/img/icon.svg"
    app-logo = "/app/shareio-ui/img/logo.svg"
    app-logo-dark = "/app/shareio-ui/img/logo-dark.svg"
    app-footer = "ShareIo · simple file sharing for Home Assistant"
    # Favicons, theme stylesheet and UI enhancements (served by NGINX)
    custom-head = "/etc/shareio/head.html"
    # Upload chunk per request. Must stay below Home Assistant's ingress
    # limit of 16 MiB per request (larger chunks fail with HTTP 413 in the
    # sidebar panel) and Cloudflare's 100 MB limit. Smaller chunks also
    # mean less to re-send after a dropped connection.
    #### Keep below 16M
    chunk-size = "10M"
    # Retry a failed chunk for about 4.5 minutes before giving up, so short
    # Wi-Fi drops, phone sleeps and Home Assistant restarts are survived.
    retry-delays = [0, 1000, 3000, 6000, 12000, 24000, 48000, 60000, 60000, 60000]
  }

  backend {
    auth {
      # Log in with Home Assistant users via the Supervisor auth API.
      #### CANNOT OVERRIDE (enforced in cont-init.d/30-config.sh)
      command {
        enabled = true
        program = [
          "/usr/bin/curl"
          "--fail"
          "--silent"
          "--user"
          "{{user}}:{{pass}}"
          "--header"
          "X-Supervisor-Token: "${SUPERVISOR_TOKEN}
          "http://supervisor/auth"
        ]
        success = 0
        order = 10
      }

      # Automatic login for the Home Assistant user opening the ingress
      # panel. NGINX sets this header only for ingress requests.
      #### CANNOT OVERRIDE (enforced in cont-init.d/30-config.sh)
      proxy {
        enabled = true
        user-header = "X-ShareIo-User"
        email-header = "X-ShareIo-Email"
      }

      # The server's own accounts are off by default; enable via conf_overrides.
      internal {
        enabled = false
      }
    }

    jdbc {
      # Set from the add-on options at startup.
      url = "jdbc:mariadb://core-mariadb:3306/shareio"
    }

    files {
      #### CANNOT OVERRIDE (enforced in cont-init.d/30-config.sh)
      stores {
        filesystem {
          directory = "/data/shareio/files"
        }
      }
      copy-files {
        target = "filesystem"
      }
    }

    signup {
      mode = "closed"
    }

    mail {
      list-id = "ShareIo"

      templates {
        download {
          subject = "Files shared with you"
          body = """Hello,

I have shared some files with you. Visit this link to download them:

{{{url}}}

{{#password}}
The password will be sent to you separately.
{{/password}}

Cheers,
{{user}} via ShareIo
"""
        }

        alias {
          subject = "Please send me files"
          body = """Hello,

Please use this link to send files to me:

{{{url}}}

Cheers,
{{user}} via ShareIo
"""
        }

        upload-notify {
          subject = "[ShareIo] Files arrived"
          body = """Hello {{user}},

Files have been uploaded for you via '{{aliasName}}'. View them here:

{{{url}}}

Cheers,
ShareIo
"""
        }
      }
    }
  }
}
