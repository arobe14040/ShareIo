# Add-on specific Sharry settings.
#
# Only values that differ from Sharry's defaults live here. Everything else
# comes from the reference.conf bundled with the Sharry release, so new
# options and changed defaults in future Sharry versions apply automatically.
# Full default config: https://eikek.github.io/sharry/doc/configure
#
# Several values are set at startup as -D properties by
# /etc/services.d/sharry/run (base-url, database, secret, theme, language,
# share limits, log level) and override what is written here.
sharry.restserver {

  # Set from the add-on options at startup.
  base-url = "http://homeassistant.local:9090"

  bind {
    address = "0.0.0.0"
    port = 9090
  }

  logging {
    minimum-level = "Info"
    levels = {
      "sharry" = ${sharry.restserver.logging.minimum-level}
      "org.flywaydb" = ${sharry.restserver.logging.minimum-level}
      "binny" = ${sharry.restserver.logging.minimum-level}
      "org.http4s" = ${sharry.restserver.logging.minimum-level}
    }
  }

  webapp {
    chunk-size = "100M"
  }

  backend {
    auth {
      # Log in with Home Assistant users via the Supervisor auth API.
      #### CANNOT OVERRIDE (enforced in cont-init.d/30-config.sh)
      command {
        enabled = true
        program = [
          "/usr/bin/curl"
          "--fail"
          "--silent"
          "--user"
          "{{user}}:{{pass}}"
          "--header"
          "X-Supervisor-Token: "${SUPERVISOR_TOKEN}
          "http://supervisor/auth"
        ]
        success = 0
        order = 10
      }

      # Sharry's own accounts are off by default; enable via conf_overrides.
      internal {
        enabled = false
      }
    }

    jdbc {
      # Set from the add-on options at startup.
      url = "jdbc:mariadb://core-mariadb:3306/sharry"
    }

    files {
      #### CANNOT OVERRIDE (enforced in cont-init.d/30-config.sh)
      stores {
        filesystem {
          directory = "/data/sharry/files"
        }
      }
      copy-files {
        target = "filesystem"
      }
    }

    signup {
      mode = "closed"
    }
  }
}
