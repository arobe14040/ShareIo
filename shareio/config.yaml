---
name: ShareIo
url: https://github.com/arobe14040/ShareIo
version: 3.6.0
slug: shareio
arch:
  - aarch64
  - amd64
description: Simple self-hosted file sharing for Home Assistant
init: false
services:
  - mysql:want
auth_api: true
ingress: true
ingress_stream: true
panel_icon: mdi:share-variant
panel_title: ShareIo
# Let every Home Assistant user (not only admins) open ShareIo; each one gets
# their own ShareIo account through the automatic Home Assistant login.
panel_admin: false
# Folders that can hold ShareIo's files ("Storage location" option)
map:
  - type: share
    read_only: false
  - type: media
    read_only: false
# Not published by default: the sidebar panel needs no port. Publish it under
# Network only to share links with people outside Home Assistant.
ports:
  9090/tcp: null
ports_description:
  9090/tcp: Direct access, only needed for public share links
# Shown on the Configuration page. Everything else is optional and appears under
# "Show unused optional configuration options" (see translations/en.yaml).
options:
  share_max_size_gb: 20
  share_max_valid_days: 30
schema:
  share_max_size_gb: float(0.01,)
  share_max_valid_days: int(1,)
  storage_location: list(addon_data|share|media)?
  storage_folder: str?
  base_url: match(^https?://[^/]+$)?
  default_language: match(^[A-Za-z]{2}$)?
  theme: list(light|dark)?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  server_secret: password?
  remote_db_type: list(mariadb|postgres)?
  remote_db_host: str?
  remote_db_port: port?
  remote_db_username: str?
  remote_db_password: password?
  remote_db_database: str?
  reset_database: bool?
  server_overrides:
    - match(^sharry[.]restserver[.][-.a-z0-9]+=.*$)?
