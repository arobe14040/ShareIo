---
name: ShareIo
url: https://github.com/arobe14040/ShareIo
version: 3.1.1
slug: shareio
arch:
  - aarch64
  - amd64
description: Simple self-hosted file sharing for Home Assistant
init: false
services:
  - mysql:want
auth_api: true
ingress: true
ingress_stream: true
panel_icon: mdi:share-variant
panel_title: ShareIo
ports:
  9090/tcp: 9090
ports_description:
  9090/tcp: Direct access (optional, for public share links)
options:
  domain: homeassistant.local
  use_ssl: false
  default_language: us
  share_max_size_gb: 1.5
  share_max_valid_days: 365
  server_secret: null
  theme: light
  log_level: info
  conf_overrides: []
schema:
  domain: match([^\/:]+)?
  use_ssl: bool?
  base_url: match(^https?://[^/]+$)?
  default_language: match([A-Za-z]{2})?
  share_max_size_gb: float(0.01,)?
  share_max_valid_days: int(1,)?
  server_secret: password
  theme: list(light|dark)?
  remote_db_type: list(mariadb|postgres)?
  remote_db_host: str?
  remote_db_port: port?
  remote_db_username: str?
  remote_db_password: password?
  remote_db_database: str?
  reset_database: bool?
  log_level: list(trace|debug|info|notice|warning|error|fatal)?
  conf_overrides:
    - property: match(^sharry[.]restserver[.][-.a-z0-9]+)
      value: str
