---
name: CI

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  ADDON_DIR: shareio
  ARCHITECTURES: '["amd64", "aarch64"]'
  IMAGE_NAME: shareio

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Lint add-on config
        uses: frenck/action-addon-linter@v2.21.1
        with:
          path: ./${{ env.ADDON_DIR }}

      - name: Lint YAML
        uses: frenck/action-yamllint@v1.5.0

      - name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: ${{ env.ADDON_DIR }}/Dockerfile
          failure-threshold: warning

      - name: Lint shell scripts
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          scandir: ./${{ env.ADDON_DIR }}/rootfs
          additional_files: run finish
          severity: error

  init:
    name: Prepare build matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Get build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.IMAGE_NAME }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [lint, init]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out code
        uses: actions/checkout@v7.0.1

      - name: Read add-on name and description
        id: info
        run: |
          echo "name=$(yq -r '.name' "${ADDON_DIR}/config.yaml")" >> "$GITHUB_OUTPUT"
          echo "description=$(yq -r '.description' "${ADDON_DIR}/config.yaml")" >> "$GITHUB_OUTPUT"

      # Test build only: nothing is pushed or signed. Home Assistant builds
      # the add-on itself when it is installed from this repository.
      - name: Build image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ./${{ env.ADDON_DIR }}
          image: ${{ matrix.image }}
          image-tags: test
          version: ${{ github.sha }}
          push: "false"
          cosign: "false"
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          build-args: |
            BUILD_ARCH=${{ matrix.arch }}
            BUILD_NAME=${{ steps.info.outputs.name }}
            BUILD_DESCRIPTION=${{ steps.info.outputs.description }}
            BUILD_REPOSITORY=${{ github.repository }}
            BUILD_REF=${{ github.sha }}
            BUILD_VERSION=test
